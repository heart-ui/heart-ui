<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Runs before any stylesheet so the first paint already has the mode, direction and theme.
      ;(function () {
        var query = new URLSearchParams(location.search)
        var html = document.documentElement
        var theme = query.get('theme')
        if (query.get('mode') === 'dark') html.classList.add('dark')
        html.setAttribute('dir', query.get('dir') === 'rtl' ? 'rtl' : 'ltr')
        html.setAttribute('data-tre-theme', theme && /^[a-z0-9-]+$/.test(theme) ? theme : 'default')
      })()
    </script>
    <title>Heart UI playground</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
