# Managed by the sdlc plugin v3.13.0 (seeded: replaced on upgrade only while unedited).
# Generated from the commands in .sdlc/config.json: the same commands verify.py runs.
name: sdlc verify

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: sdlc-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash  # Git Bash on Windows runners: same shell everywhere

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # registry:api --check judges breaking API changes against origin/main.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: corepack enable
      - name: "install"
        run: |
          pnpm install --frozen-lockfile && pnpm test:install
      - name: "lint"
        run: |
          pnpm lint
      - name: "typecheck"
        run: |
          pnpm typecheck
      - name: "test"
        run: |
          pnpm test
